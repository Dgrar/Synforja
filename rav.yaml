name: Synforja
version: "1.0.0"
scripts:
  be_start: cd backend && py -m uvicorn core.asgi:application --host 127.0.0.1 --port 8000
  be_migrate: cd backend && py manage.py migrate
  be_make_migrations: cd backend && py manage.py makemigrations

  fe_start: cd frontend && npm run dev
  fe_install: cd frontend && npm install

  dev: 
    - rav run be_start
    - rav run fe_start
  